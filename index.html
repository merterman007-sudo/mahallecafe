<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Mahalle Cafe QR Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=admin-20261015" />
</head>
<body>
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>

  <div class="side-photo left" aria-hidden="true">
    <img src="assets/salad.jpg" alt="" />
  </div>
  <div class="side-photo right" aria-hidden="true">
    <img src="assets/pasta.jpg" alt="" />
  </div>

  <header class="hero container">
    <div class="brand-block">
      <div class="brand-top">
        <img class="brand-logo" src="assets/mahalle-logo.png" alt="Mahalle Cafe Logo" onerror="this.style.display='none'" />
        <div>
          <p class="kicker">MAHALLE CAFE</p>
          <p class="brand-slogan">YENİ NESİL KAFE</p>
        </div>
      </div>
      <h1>MAHALLE QR MENU</h1>
      <p class="hero-copy">Kahvaltıdan sıcak-soğuk içeceklere ve yemeklere kadar tüm ürünler tek ekranda.</p>
      <div class="meta-row">
        <span>08:00 - 01:00</span>
        <span>Masaya Servis</span>
        <span>Fiyatlara KDV Dahil</span>
      </div>
    </div>

    <div class="hero-media">
      <img src="assets/coffee.jpg" alt="Mahalle Cafe kahve sunumu" />
      <div class="media-badge">Yeni Fiyat Listesi</div>
    </div>
  </header>

  <section class="container category-showcase" aria-label="Kategori seçimi">
    <div id="photo-category-grid" class="photo-category-grid"></div>
  </section>

  <main class="container main-grid">
    <section id="menu-panel" class="content is-hidden">
      <div class="toolbar glass">
        <button id="home-btn" class="back-btn" type="button">← Kategoriler</button>
        <input id="search-input" type="search" placeholder="Ürün ara: latte, kola, makarna..." aria-label="Ürün ara" />
        <button id="clear-btn" type="button">Temizle</button>
      </div>
      <div id="menu-root" class="menu-root"></div>
    </section>
  </main>

  <footer class="container footer">
    <p id="menu-updated">Mahalle Cafe • Güncel QR Menü</p>
  </footer>

  <script src="api-config.js?v=1"></script>
  <script src="app.js?v=admin-20261015"></script>
</body>
</html>
